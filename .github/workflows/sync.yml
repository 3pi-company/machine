# حلقة السحب المركزية لجوليب (C-0002 وC-0001): كود بس، صفر بيانات عميل. دورة كل 10 دقايق جوه تشغيلة واحدة (حوالي 5 ساعات ونص)
# وبتطلق اللي بعدها بنفسها. الـcron هنا احتياطي بس (GitHub بيتأخر فيه). التفاصيل: tools/loop.sh وtools/iterate.sh.
# قرار المسؤول 2026-11-16: ممنوع تأخير تحديث اللوحات. السجل العام صامت (سطر لكل عميل).
name: sync
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
concurrency:
  group: machine-loop
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      PLATFORM_PAUSE: ${{ vars.PLATFORM_PAUSE }}
      CLIENT_C0002_JULEB_URL: ${{ secrets.CLIENT_C0002_JULEB_URL }}
      CLIENT_C0002_JULEB_API_KEY: ${{ secrets.CLIENT_C0002_JULEB_API_KEY }}
      CLIENT_C0002_JULEB_DB: ${{ secrets.CLIENT_C0002_JULEB_DB }}
      CLIENT_C0002_JULEB_USER: ${{ secrets.CLIENT_C0002_JULEB_USER }}
      CLIENT_C0002_JULEB_PASS: ${{ secrets.CLIENT_C0002_JULEB_PASS }}
      CLIENT_C0001_JULEB_URL: ${{ secrets.CLIENT_C0001_JULEB_URL }}
      CLIENT_C0001_JULEB_DB: ${{ secrets.CLIENT_C0001_JULEB_DB }}
      CLIENT_C0001_JULEB_USER: ${{ secrets.CLIENT_C0001_JULEB_USER }}
      CLIENT_C0001_JULEB_PASS: ${{ secrets.CLIENT_C0001_JULEB_PASS }}
    steps:
      - uses: actions/checkout@v4
        with: { path: code }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Loop
        run: bash code/tools/loop.sh
